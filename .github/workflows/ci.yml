name: SDK conformance

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: sdk-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.0
      - name: Download approved package bytes
        id: prebuilt
        if: ${{ hashFiles('.github/sdk-ci/approved-package.json') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/sdk-ci/approved-package.mjs
      - name: Replay reviewed responses and streaming scenarios
        id: conformance
        env:
          REACON_SOURCE_REVISION: ${{ github.sha }}
          REACON_PREBUILT_DIRECTORY: ${{ steps.prebuilt.outputs.directory }}
        run: |
          # Owner-writable files permit repeated copies into the result directory.
          # Consumers still mount this input read-only and verify exact checksums.
          if [ -n "$REACON_PREBUILT_DIRECTORY" ]; then
            chmod u+w "$REACON_PREBUILT_DIRECTORY"/artifacts/*
          fi
          node .github/sdk-ci/run.mjs
      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sdk-ci-results/evidence.json
            sdk-ci-results/responses.json
            sdk-ci-results/run.log
            sdk-ci-results/package-manifest.json
            sdk-ci-results/artifacts/
          if-no-files-found: error
          retention-days: 30
